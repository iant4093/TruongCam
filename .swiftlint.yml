# Correctness checks; compiler warnings and strict concurrency are separate gates.
included:
  - src
excluded:
  - src/TruongCamTests
only_rules:
  - compiler_protocol_init
  - discarded_notification_center_observer
  - duplicate_enum_cases
  - duplicate_imports
  - duplicated_key_in_dictionary_literal
  - force_cast
  - force_try
  - notification_center_detachment
  - prohibited_super_call
  - return_value_from_void_function
  - unneeded_break_in_switch
  - unused_capture_list
  - valid_ibinspectable
  - weak_delegate
strict: true
