name: CI and IPA release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Workflow and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint, zizmor and Gitleaks
        run: bash scripts/check-workflows.sh

  logic:
    name: SwiftLint and portable tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: SwiftLint
        run: bash scripts/lint.sh
      - name: Portable regression tests
        run: bash scripts/verify-logic.sh
      - name: Upload portable test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portable-test-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native Simulator tests
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Native Simulator tests
        timeout-minutes: 20
        run: bash scripts/test.sh native
      - name: Upload native results and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-test-results
          path: |
            build/logs/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  device:
    name: Device build and security analysis
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${sdk%%.*}" -ge 27
          printf 'TRUONGCAM_BUILD_NUMBER=%s\n' "$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: swift
          build-mode: manual
      - name: Unsigned Debug and Release builds
        run: bash scripts/build.sh
      - name: Xcode static analysis
        run: |
          xcodebuild -project TruongCam.xcodeproj -scheme TruongCam \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/AnalysisDerivedData CODE_SIGNING_ALLOWED=NO \
            analyze > build/logs/analyze.log 2>&1
      - name: CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:swift
      - name: Validate and package IPA
        run: |
          bash scripts/package-ipa.sh
          mkdir -p dist
          cp build/ipa/*-unsigned.ipa dist/TruongCam.ipa
          ditto -c -k --keepParent \
            build/ReleaseDerivedData/Build/Products/Release-iphoneos/TruongCam.app.dSYM \
            dist/TruongCam.dSYM.zip
          (cd dist && shasum -a 256 TruongCam.ipa TruongCam.dSYM.zip > SHA256SUMS)
      - name: Attest release artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Upload release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: device-build-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish latest IPA
    needs: [quality, logic, native, device]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-candidate
          path: dist
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          head_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is on main; its successful build will publish instead.'
            exit 0
          fi
          tag="build-$GITHUB_RUN_NUMBER"
          if gh release view "$tag" --json isDraft --jq .isDraft > existing-draft 2>/dev/null; then
            if [ "$(cat existing-draft)" = false ]; then
              echo 'This run already published its release.'
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "TruongCam · Build $((1000 + GITHUB_RUN_NUMBER))" \
              --notes "Built from $GITHUB_SHA after lint, regression tests, static analysis and CodeQL. Download TruongCam.ipa and sign it with your sideloading tool. This is an unsigned device IPA, not an App Store or TestFlight build. Checksums and matching crash symbols are attached."
          fi
          gh release upload "$tag" TruongCam.ipa TruongCam.dSYM.zip SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --latest
